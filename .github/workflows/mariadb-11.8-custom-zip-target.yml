name: Build MariaDB 11.8-custom-zip-target

on:
  workflow_dispatch: # Abilita l'avvio manuale

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout MariaDB Source
        uses: actions/checkout@v4
        with:
          repository: MariaDB/server
          ref: mariadb-11.8.9
          submodules: recursive

      - name: Install Bison and Flex
        run: choco install winflexbison3

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Crea i file di configurazione CMake
        shell: bash
        run: |
          cat <<'EOF' > CPackZipConfig.cmake
          ######################
          # CPackZIPConfig.cmake
          ######################
          INCLUDE(CPackConfig.cmake)
          SET(CPACK_GENERATOR ZIP)
          set(CPACK_ARCHIVE_COMPONENT_INSTALL ON)
          set(CPACK_COMPONENTS_GROUPING ALL_COMPONENTS_IN_ONE)
          SET(CPACK_COMPONENT_INCLUDE_TOPLEVEL_DIRECTORY ON)
          set(COMPONENTS_IGNORE Debuginfo Server_Scripts SqlBench Test plugin-hashicorp-key-management)
          FOREACH(it ${COMPONENTS_IGNORE})
            list(FIND CPACK_COMPONENTS_ALL  "${it}" index)
            IF(index GREATER 0)
              LIST(REMOVE_AT CPACK_COMPONENTS_ALL ${index})
            ENDIF()
          ENDFOREACH()
          EOF

          cat <<'EOF' > my_custom_targets.cmake
          function(aggiungi_target_pacchetto)
            if(TARGET cicciosoft_win_package_zip)
              return()
            endif()
            ADD_CUSTOM_TARGET(
              cicciosoft_win_package_zip
              COMMAND ${CMAKE_CPACK_COMMAND} ${CPACK_CONFIG_PARAM} --config ${CMAKE_SOURCE_DIR}/CPackZipConfig.cmake
              WORKING_DIRECTORY ${CMAKE_BINARY_DIR}
            )
            SET_TARGET_PROPERTIES(
              cicciosoft_win_package_zip
              PROPERTIES
              EXCLUDE_FROM_ALL TRUE
              EXCLUDE_FROM_DEFAULT_BUILD TRUE
            )
          endfunction()
          cmake_language(DEFER CALL aggiungi_target_pacchetto)
          EOF

          echo "File creato: $(pwd)/CPackZipConfig.cmake"
          echo "File creato: $(pwd)/my_custom_targets.cmake"

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DWITH_EMBEDDED_SERVER=ON `
            -DWITH_UNIT_TESTS=OFF `
            -DWITH_MARIABACKUP=OFF `
            -DWITH_WSREP=OFF `
            -DINSTALL_DOCDIR=NONE `
            -DINSTALL_SUPPORTFILESDIR=NONE `
            -DCPACK_NOSYMBOLS=ON `
            -DPLUGIN_AUTH_GSSAPI=NO `
            -DPLUGIN_MYISAM=NO `
            -DPLUGIN_ARIA=YES `
            -DPLUGIN_INNOBASE=YES `
            -DPLUGIN_ARCHIVE=NO `
            -DPLUGIN_BLACKHOLE=NO `
            -DPLUGIN_CSV=NO `
            -DPLUGIN_FEDERATED=NO `
            -DPLUGIN_FEDERATEDX=NO `
            -DPLUGIN_ROCKSDB=NO `
            -DPLUGIN_CONNECT=NO `
            -DPLUGIN_SEQUENCE=NO `
            -DPLUGIN_SPIDER=NO `
            -DPLUGIN_EXAMPLE=NO `
            -DCMAKE_PROJECT_INCLUDE="${{ github.workspace }}\my_custom_targets.cmake"

      - name: Build Embedded Server
        run: cmake --build build

      - name: Generate Official Windows ZIP Package
        working-directory: ./build
        run: cmake --build . --target cicciosoft_win_package_zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-11.8.9-custom-target
          path: build/*.zip