name: Build MariaDB 11.8-Minimal

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout MariaDB Source
        uses: actions/checkout@v4
        with:
          repository: MariaDB/server
          # ref: mariadb-11.8.9
          ref: bf9193a939f515e95dd8def1a5468088c91cede6
          submodules: recursive

      - name: Install Bison and Flex
        run: choco install winflexbison3

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Apply inline patch
        shell: bash
        run: |
          patch -p1 << 'EOF'
          --- a/win/packaging/CMakeLists.txt	2026-08-19 11:29:29.000000000 +0200
          +++ b/win/packaging/CMakeLists.txt	2026-09-11 17:22:43.824644100 +0200
          @@ -218,7 +218,7 @@ ENDIF()
           
           ADD_CUSTOM_TARGET(
             win_package_zip
          -  ${SIGN_COMMAND}
          +#  ${SIGN_COMMAND}
             COMMAND ${CMAKE_CPACK_COMMAND} ${CPACK_CONFIG_PARAM} --config ${CMAKE_CURRENT_SOURCE_DIR}/CPackZipConfig.cmake
             WORKING_DIRECTORY ${CMAKE_BINARY_DIR}
           )
          --- a/win/packaging/ComponentsIgnore.cmake	2026-08-19 11:29:29.000000000 +0200
          +++ b/win/packaging/ComponentsIgnore.cmake	2026-09-11 17:23:39.702074100 +0200
          @@ -1,2 +1,3 @@
           # Components ignored in both ZIP and WIX generators
          -set(COMPONENTS_IGNORE Debuginfo Server_Scripts SqlBench Test Embedded  plugin-hashicorp-key-management)
          +#set(COMPONENTS_IGNORE Debuginfo Server_Scripts SqlBench Test Embedded  plugin-hashicorp-key-management)
          +set(COMPONENTS_IGNORE Debuginfo Server_Scripts SqlBench Test plugin-hashicorp-key-management)
          EOF

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DWITH_EMBEDDED_SERVER=ON `
            -DWITH_UNIT_TESTS=OFF `
            -DWITH_MARIABACKUP=OFF `
            -DWITH_WSREP=OFF `
            -DPLUGIN_AUTH_GSSAPI=NO `
            -DPLUGIN_ARCHIVE=NO `
            -DPLUGIN_BLACKHOLE=NO `
            -DPLUGIN_FEDERATED=NO `
            -DPLUGIN_FEDERATEDX=NO `
            -DPLUGIN_ROCKSDB=NO `
            -DPLUGIN_CONNECT=NO `
            -DPLUGIN_SPIDER=NO `
            -DPLUGIN_SPHINX=NO `
            -DPLUGIN_FEEDBACK=NO `
            -DPLUGIN_EXAMPLE=NO `
            -DCPACK_PACKAGE_FILE_NAME="${CPACK_PACKAGE_NAME}-${CPACK_PACKAGE_VERSION}-minimal-${CPACK_SYSTEM_NAME}"

      - name: Build MariaDB
        run: cmake --build build

      - name: Generate Windows ZIP Package
        working-directory: ./build
        run: cmake --build . --target win_package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-11.8.9-minimal
          path: build/*.zip